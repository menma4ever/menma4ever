name: Refresh contribution Tetris

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-tetris.yml"
      - "scripts/render_contributions.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Render real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/render_contributions.py --output assets/contribution-tetris.gif
      - name: Commit updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-tetris.gif
          git diff --cached --quiet || git commit -m "Refresh contribution Tetris animation"
          git push origin HEAD:main
